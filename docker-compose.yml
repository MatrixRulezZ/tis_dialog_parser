version: '3.8'
services:
  tis-bot:
    build: .
    environment:
      - BOT_TOKEN=${BOT_TOKEN}
      - TIS_DB_KEY=${TIS_DB_KEY}
      - DB_FILE=/app/data/tis_users.db   # БД внутри volume, чтобы переживать пересоздание контейнера
    volumes:
      - ./data:/app/data          # ← важно для сохранения БД
    restart: unless-stopped
